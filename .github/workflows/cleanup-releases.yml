name: Cleanup old releases
on:
  workflow_dispatch:
  push:
    branches: [cleanup-run]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar el release brick de WALT (gaming-28112026-0300)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tag in gaming-28112026-0300; do
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag && echo "DEL $tag" || echo "skip $tag"
          done
